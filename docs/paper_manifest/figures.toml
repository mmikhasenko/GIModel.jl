# Figures 1-16 of Godfrey-Isgur 1985 (Phys. Rev. D 32, 189).
#
# Page numbers are page-IMAGE numbers (paper/vision_ocr/page_images/page-0NN.png);
# the mapping is  image = journal_pg - 188  (journal p.189 = page-001.png).
# Each anchor below was verified against the printed page image (the OCR
# "PDF Page" markers drift after page 12 and were corrupted around Fig. 16, so
# the late anchors were read off the images directly, not the OCR markers).
#
# Reproduced: Fig. 2 (running coupling) and Figs. 3-9 (the seven sector spectra).
# Everything else is illustrative / discussion material (context): schematic
# Feynman graphs (1, 13-15), the potential sketch (12), hypothetical top-quark
# spectra (10, 11), and the 0++ coupled-channel phenomenology (16).

schema_version = 1

# --- Sec. II figures -------------------------------------------------------

[[unit]]
id = "fig-1"
kind = "figure"
label = "Fig. 1"
page = 3
statement = "The annihilation interaction H_A: a typical qqbar -> gluons -> qqbar graph (schematic origin of the H_A term)."
status = "context"
anchor = "paper/vision_ocr/page_images/page-003.png"
parent = "sec-II"
notes = "A schematic Feynman graph, nothing to reproduce numerically. The physics it represents (the annihilation Hamiltonian, Eq. 16) is implemented via src/pseudoscalar_annihilation.jl / isoscalar_general_annihilation; the figure itself is context."

[[unit]]
id = "fig-2"
kind = "figure"
label = "Fig. 2"
page = 4
statement = "The saturating running coupling alpha_s(Q^2) [Eq. (12)] fitted to lowest-order QCD: alpha_s = 0.25 exp(-Q^2) + 0.15 exp(-Q^2/10) + 0.20 exp(-Q^2/1000)."
status = "reproduced"
code = ["src/running_coupling.jl:alpha_s_r"]
tests = ["GI momentum-space alpha_s profile"]
metric = "alpha_s^critical = sum a_k = 0.60; the three (a_k, gamma_k) coefficients are the paper's own Fig. 2 fit (tier-A input), reproduced as alpha_s_q / alpha_s_r with analytic derivatives."
anchor = "paper/vision_ocr/page_images/page-004.png"
parent = "sec-II"
notes = "Fig. 2 caption/plot is on page-004 (journal 192); the eqs and the 'as shown in Fig. 2' reference sit on page-003. alpha_s_r is the r-space erf form [Eq. (13)] used by the potential; alpha_s_q is the Q^2 form plotted. Regression-tested (also 'GI erf profile' testsets)."


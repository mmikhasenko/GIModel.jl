0.59 fm, K0 -0.315 vs -0.30 fm (genuine predictions, negative K0 reproduced). Excluded: only the unphysical hypothetical t-tbar rows (eta_t, zeta; no top mass in the 1985 set). Data: table_vii_annihilation_em.csv, 61 rows."


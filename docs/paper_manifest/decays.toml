kind = "input"
label = "Decay oscillator beta = 0.40 GeV"
page = 14
statement = "Single harmonic-oscillator scale beta for the SHO-limit decay amplitudes (Table V caption; Table VI footnote g confirms 'as in Table V')."
status = "reproduced"
code = ["src/strong_decays.jl:spatial_overlap"]
anchor = "paper/vision_ocr/page_images/page-014.png"
parent = "sec-IV"
notes = "Paper's own input, not fitted. The form factor is now one expression exp[-(1/4) r^2 q^2/beta_c^2] parametrized by the heavy fraction r = m_Q/(m_Q+m_q); the light Gaussian exp(-q^2/16 beta^2) is exactly its r = 1/2 point (verified bitwise), so there is no separate charm branch and a b-flavored row would simply pass a larger r. r is carried per row on DecayChannel and resolved by the harness from the parent's flavor content, since the canonical CSV has no quark-content column. Note the paper applies this unequal-mass treatment to CHARMED rows only: strange rows are also unequal-mass (r = 0.66) yet keep the equal-mass Gaussian, so 0.5 there is the paper's convention, not the kinematics."


[[paper_table_policy.table_vii.dilepton_validation]]
label = "psi' -> e+ e-"
note = ""
width_GeV = 2.34e-6
[[paper_table_policy.table_vii.dilepton_validation]]
label = "Upsilon -> e+ e-"

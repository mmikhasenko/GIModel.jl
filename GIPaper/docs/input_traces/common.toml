[paper_table_policy.metadata]
doi = "10.1103/PhysRevD.32.189"
role = "Paper reproduction prescriptions and legacy validation anchors; not generic operator defaults"
source = "Godfrey and Isgur, Phys. Rev. D 32, 189 (1985), Tables V-VII and associated discussion"

[paper_table_policy.table_v]
B_amplitude = -11.0
amplitude_unit = "MeV^(1/2)"
charmed_parents = ["Dstar0", "Dstarplus", "Kstar_c", "kappa_c", "Q1c", "Q2c"]
convention = "LeadingS0"
heavy_fraction_policy = "Table V footnote d: use m_c/(m_c+m_d) only for the listed charmed rows; other rows use the equal-mass value 1/2"
rho_amplitude = 12.4
source = "Table V rho -> pi pi and B -> omega pi calibration amplitudes"

    [[paper_table_policy.table_v.mixing]]
    section = "1P_1 strange"
    singlet = "Q1"
    source = "Fig. 4 / Table V footnote b; rounded paper mixing angle, not solved anew by this harness"
    theta_deg = 34.0
    triplet = "Q2"
    [[paper_table_policy.table_v.mixing]]
    section = "1^3D_2 1^1D_2 strange"
    singlet = "Q1_1D2"
    source = "Table V same-J strange D-wave prescription; rounded paper angle"
    theta_deg = 33.0
    triplet = "Q2_1D2"
    [[paper_table_policy.table_v.mixing]]
    section = "1P_1 charmed"
    singlet = "Q1c"
    source = "Table V charmed P-wave prescription; rounded paper angle"
    theta_deg = -41.0
    triplet = "Q2c"

[paper_table_policy.table_vi]
flavor_policy = "Neutral light isovectors use the isovector charge combination; other flavor assignments and mixed-state flags are in table_vi_states.csv"
isovectors = ["rho", "pi", "pi0", "A2", "A1", "B"]
source = "Table VI footnote a: additive magnetic-moment contribution, in nuclear magnetons"
supplementary_footnote = "a"
supplementary_mu_N = 0.01

[[paper_table_policy.table_vii.dilepton_validation]]
label = "rho -> e+ e-"
note = ""
width_GeV = 7.04e-6
[[paper_table_policy.table_vii.dilepton_validation]]
label = "psi -> e+ e-"
note = "QCD (1−16α_s/3π) not in D8"

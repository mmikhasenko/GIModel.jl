name: Lint

on:
    push:
        branches:
            - main
        tags: ["*"]
    pull_request:

concurrency:
    # Skip intermediate builds: always.
    # Cancel intermediate builds: only if it is a pull request build.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    link-checker:
        name: Link checker
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            # Repository-internal links only: the paper and PDG references sit
            # behind publisher bot protection that makes online checks flaky.
            # docs/ is excluded: Documenter resolves its cross-references and
            # fails the documentation build on a broken link.
            - name: Link Checker
              id: lychee
              uses: lycheeverse/lychee-action@v2
              with:
                  args: --offline --no-progress --exclude-path docs './**/*.md'
                  fail: true

name: Test

on:
    push:
        branches:
            - main
        tags: ["*"]
    workflow_dispatch:

jobs:
    test:
        uses: ./.github/workflows/ReusableTest.yml
        with:
            project: ${{ matrix.project }}
            os: ${{ matrix.os }}
            version: ${{ matrix.version }}
            arch: ${{ matrix.arch }}
            allow_failure: ${{ matrix.allow_failure }}
            run_codecov: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
        secrets:
            codecov_token: ${{ secrets.CODECOV_TOKEN }}
        strategy:
            fail-fast: false
            matrix:
                project:
                    - "."
                    - QuarkModelTransitions
                    - GIPaper
                version:
                    - "1.11"
                    - "1"
                os:
                    - ubuntu-latest
                    - macOS-latest
                    - windows-latest
                arch:
                    - x64
                allow_failure: [false]

name: Learning sheets

on:
    push:
        branches: [main]
        paths:
            - 'LearningTrack/**'
            - '.github/workflows/LearningSheets.yml'
    pull_request:
        paths:
            - 'LearningTrack/**'
            - '.github/workflows/LearningSheets.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: learning-sheets-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - name: Install and cache TeX Live
              uses: zauguin/install-texlive@v4
              with:
                  cache: true
                  packages: >-
                      scheme-basic latexmk collection-latexrecommended
                      collection-latexextra collection-fontsrecommended
                      collection-mathscience
            - name: Build every sheet
              run: make -C LearningTrack
            - name: Save PDFs
              uses: actions/upload-artifact@v7
              with:
                  name: learning-sheets
                  path: LearningTrack/pdf/*.pdf
                  if-no-files-found: error
                  retention-days: 30

    publish:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: learning-sheets
                  path: pdf
            - name: Publish individual PDF downloads
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  SOURCE_SHA: ${{ github.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  tag=learning-sheets
                  {
                      printf 'PDFs built from commit `%s`. Updated after successful builds on main.\n\n' "$SOURCE_SHA"
                      for pdf in pdf/*.pdf; do
                          name=$(basename "$pdf")
                          printf -- '- [%s](https://github.com/%s/releases/download/%s/%s)\n' "$name" "$GH_REPO" "$tag" "$name"
                      done
                  } > notes.md
                  if ! gh release view "$tag" >/dev/null 2>&1; then
                      gh release create "$tag" --target "$SOURCE_SHA" \
                          --title 'Learning sheets' --notes-file notes.md \
                          --prerelease --latest=false
                  fi
                  gh release upload "$tag" pdf/*.pdf --clobber
                  gh release edit "$tag" --notes-file notes.md
                  cat notes.md >> "$GITHUB_STEP_SUMMARY"

name: Reusable test

on:
    workflow_call:
        inputs:
            project:
                description: "Package directory: '.' or 'GIPaper'"
                required: false
                type: string
                default: "."
            version:
                required: false
                type: string
                default: "1"
            os:
                required: false
                type: string
                default: ubuntu-24.04
            arch:
                description: "Julia architecture; default uses the runner's native architecture"
                required: false
                type: string
                default: default
            allow_failure:
                required: false
                type: boolean
                default: false
            run_codecov:
                required: false
                type: boolean
                default: false
        secrets:
            codecov_token:
                required: false

jobs:
    test:
        name: ${{ inputs.project }} - Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }}
        runs-on: ${{ inputs.os }}
        continue-on-error: ${{ inputs.allow_failure }}

        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ inputs.version }}
                  arch: ${{ inputs.arch }}
            - name: Use Julia cache
              uses: julia-actions/cache@v3
            # Companion packages resolve through [sources] path entries, so each
            # package is tested against the checked-out siblings.
            - uses: julia-actions/julia-buildpkg@v1
              with:
                  project: ${{ inputs.project }}
            # Quick suite only; heavy tests need GI_HEAVY_TESTS=true.
            - uses: julia-actions/julia-runtest@v1
              with:
                  project: ${{ inputs.project }}
            - uses: julia-actions/julia-processcoverage@v1
              if: ${{ inputs.run_codecov }}
              with:
                  directories: ${{ inputs.project == '.' && 'src,QuarkModelTransitions/src' || 'GIPaper/src' }}
            - uses: codecov/codecov-action@v7
              if: ${{ inputs.run_codecov }}
              with:
                  files: lcov.info
                  flags: ${{ inputs.project == '.' && 'GIModel' || inputs.project }}
                  token: ${{ secrets.codecov_token }}

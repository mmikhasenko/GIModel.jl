name: TagBot

on:
    issue_comment:
        types:
            - created
    workflow_dispatch:
        inputs:
            lookback:
                type: number
                default: 3

permissions:
    actions: read
    checks: read
    contents: write
    deployments: read
    issues: read
    discussions: read
    packages: read
    pages: read
    pull-requests: read
    repository-projects: read
    security-events: read
    statuses: read

jobs:
    TagBot:
        if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                # Subdirectory packages are tagged `<Name>-v<version>`.
                subdir: ["", "GIPaper"]
        steps:
            - uses: JuliaRegistries/TagBot@v1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ssh: ${{ secrets.DOCUMENTER_KEY }}
                  subdir: ${{ matrix.subdir }}

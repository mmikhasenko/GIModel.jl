parameters = """[metadata]\nsource = \"Godfrey-Isgur 1985\"\ndoi = \"10.1103/PhysRevD.32.189\"\npage = 5\ntable = \"Table II\"\nstatus = \"reviewed_runtime_preset\"\nauthority_note = \"Runtime preset reviewed against Table II and Appendix A; see docs/model_inputs.md. Historical filename retained for compatibility. Table II reference transcription lives in GIPaper/data/clean/.\"\n\n[masses]\nm_ud_avg_MeV = 220\nm_s_MeV = 419\nm_c_MeV = 1628\nm_b_MeV = 4977\n\n[potential]\nb_GeV2 = 0.18\nc_MeV = -253\n# Which central-potential construction to use (mutually exclusive by design):\n#   \"pointwise\"                    — raw V = br - 4α_s/(3r) + c diagnostic baseline.\n#   \"coulomb_1d_smear\"             — 1D Gaussian of G(r) on the mesh only; S(r) pointwise.\n#                                    Same σ as (A9); not (A12)–(A13).\n#   \"appendix_a_smearing\"          — naive 3D Gaussian (A8) of pointwise G and S with the\n#                                    contact-hyperfine σ (A9); wipes the small-r Coulomb\n#                                    well on a radial grid.\n#   \"appendix_a_derivative_g\"      — first derivative-expansion term for smeared Coulomb\n#                                    G(r), with S(r) pointwise; modular Appendix-A proxy.\n#   \"appendix_a_closed_form\"       — closed-form Gaussian smearing of G(r) and S(r) via\n#                                    the checked (A12)–(A14) τ_k and smeared-linear\n#                                    formulas; diagonal only (no G' momentum sandwich).\n#   \"appendix_a_momentum_sandwich\" — active reproduction path: closed-form G~, S~, plus\n#                                    the nonlocal Coulomb momentum sandwich A(p) G~ A(p),\n#                                    A(p) = sqrt(1 + p^2/(E1 E2)), on the FD basis.\ncentral = \"appendix_a_momentum_sandwich\"\n\n[relativistic_smearing]\nsigma0_GeV = 1.80\ns = 1.55\n\n[relativistic_factors]\nepsilon_c = -0.168\nepsilon_t = 0.025\nepsilon_so_vector = -0.035\nepsilon_so_scalar = 0.055\n# Appendix A15: apply the GI momentum-dependent factor as a Hermitian sandwich\n# around the exact Laplacian contact operator.\ncontact_momentum_sandwich = true\n# Appendix A15-A16: apply the GI Hermitian momentum-factor sandwiches to the\n# vector/scalar spin-orbit and tensor operators. Both diagonal fixed-sector\n# terms and unequal-mass antisymmetric mixing use this prescription.\nfine_structure_momentum_sandwich = true\n# Use derivatives of the closed-form smeared Coulomb G~ and confinement S~:\n# A15 uses dG/dr and d²G/dr²; A16 uses dS/dr without duplicating Coulomb.\nfine_structure_smeared_kernels = true\n\n[fine_structure]\n# Appendix-A vector + scalar spin–orbit and tensor operators. Their strengths\n# are fixed by Eqs. (A15)-(A16); this section contains only the master switch.\nenabled = true\n\n[annihilation]\n# Paper Table III pseudoscalar model constants.\n# P1 uses Eq. (18a): A_np exp[-(m_i^2+m_j^2)/m_eta^2] plus the perturbative term.\np1_A_np = 0.50\np1_m_eta_GeV = 0.548\n# P2 uses Eq. (18b): a mass-dependent nonperturbative term with zero at M0.\np2_A_np = 0.55\np2_M0_GeV = 1.17\n# Table III A(^3S_1) amplitude for general isoscalar vector annihilation Eq. (16).\ns1_A = 2.5\n# Table III A(^3P_2) amplitude for the f2/f2' tensor-channel annihilation Eq. (16).\na_3p2 = -0.8\n"""

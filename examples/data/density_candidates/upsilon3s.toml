scalar = 0.055\n# Appendix A15: apply the GI momentum-dependent factor as a Hermitian sandwich\n# around the exact Laplacian contact operator.\ncontact_momentum_sandwich = true\n# Appendix A15-A16: apply the GI Hermitian momentum-factor sandwiches to the\n# vector/scalar spin-orbit and tensor operators. Both diagonal fixed-sector\n# terms and unequal-mass antisymmetric mixing use this prescription.\nfine_structure_momentum_sandwich = true\n# Use derivatives of the closed-form smeared Coulomb G~ and confinement S~:\n# A15 uses dG/dr and d²G/dr²; A16 uses dS/dr without duplicating Coulomb.\nfine_structure_smeared_kernels = true\n\n[fine_structure]\n# Appendix-A vector + scalar spin–orbit and tensor operators. Their strengths\n# are fixed by Eqs. (A15)-(A16); this section contains only the master switch.\nenabled = true\n\n[annihilation]\n# Paper Table III pseudoscalar model constants.\n# P1 uses Eq. (18a): A_np exp[-(m_i^2+m_j^2)/m_eta^2] plus the perturbative term.\np1_A_np = 0.50\np1_m_eta_GeV = 0.548\n# P2 uses Eq. (18b): a mass-dependent nonperturbative term with zero at M0.\np2_A_np = 0.55\np2_M0_GeV = 1.17\n# Table III A(^3S_1) amplitude for general isoscalar vector annihilation Eq. (16).\ns1_A = 2.5\n# Table III A(^3P_2) amplitude for the f2/f2' tensor-channel annihilation Eq. (16).\na_3p2 = -0.8\n"""
